[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "league-standings"
version = "1.0.0"
description = "Calculate a football league table from match results (1974/75 English First Division rules)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
typecheck = ["pytest>=7", "mypy==2.3.1", "pyright==1.1.414"]

[project.scripts]
league-table = "standings.cli:main"

[tool.setuptools]
packages = ["standings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
# Use the project's virtual environment (where pytest is installed), so
# editors such as VS Code (Pylance) resolve imports correctly.
venvPath = "."
venv = ".venv"
# Check against the oldest supported Python (the macOS system python3).
pythonVersion = "3.9"
include = ["standings", "tests", "scripts"]

[tool.mypy]
files = ["standings", "tests", "scripts"]
